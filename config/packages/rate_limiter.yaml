framework:
    rate_limiter:
        # Many password guesses from one IP.
        auth_login_ip:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
            lock_factory: null
        # Many guesses against one account from many IPs.
        auth_login_email:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
            lock_factory: null
        auth_refresh:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
            lock_factory: null
        auth_register:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            lock_factory: null

when@test:
    framework:
        rate_limiter:
            # In tests the counters live in an in-memory storage. Unlike a cache
            # pool it is not reset between requests (kernel.reset), and every test
            # boots a fresh kernel, so no state leaks between tests.
            auth_login_ip:
                storage_service: limiter.storage.in_memory
            auth_login_email:
                storage_service: limiter.storage.in_memory
            auth_refresh:
                storage_service: limiter.storage.in_memory
            auth_register:
                storage_service: limiter.storage.in_memory
