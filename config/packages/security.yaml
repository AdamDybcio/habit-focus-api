security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            id: App\User\Infrastructure\Security\UserProvider

    firewalls:
        # Public endpoints: login, register, refresh, logout and the health
        # check. Everything else needs a valid access token.
        public:
            pattern: ^/(auth|health)(/|$)
            security: false

        api:
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Cheap hashing keeps the test suite fast. Never use in production.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
